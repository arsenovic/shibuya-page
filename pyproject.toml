[project]
name = "shibuya-page"
version = "0.1.0"
description = "The Shibuya Sphinx theme, laid out as a sheet of paper on a desk"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "arsenovic", email = "alexanderarsenovic@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "sphinx>=9.1",
    # theme/components/breadcrumbs.html is a copy of Shibuya 2026.7.12's; check it against each new release
    "shibuya>=2026.7.12,<2027",
]
keywords = ["sphinx", "theme", "documentation", "shibuya"]
classifiers = [
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Theme",
    "Topic :: Documentation :: Sphinx",
    "Programming Language :: Python :: 3",
]

[project.urls]
repository = "https://github.com/arsenovic/shibuya-page"
documentation = "https://arsenovic.github.io/shibuya-page/"

[project.entry-points."sphinx.html_themes"]
shibuya-page = "shibuya_page"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
