[theme]
inherit = "shibuya"
stylesheets = [
    "shibuya.css",
    "shibuya-page/layout.css",
    "shibuya-page/components.css",
]
pygments_style = { default = "sphinx", dark = "github-dark" }
# Shibuya's right sidebar, with the Fold code button above "On this page"
sidebars = [
    "sidebars/fold-code.html",
    "sidebars/localtoc.html",
    "sidebars/repo-stats.html",
    "sidebars/edit-this-page.html",
    "sidebars/carbon-ads.html",
    "sidebars/ethical-ads.html",
]

[options]
# rtd, alabaster, pydata, or none (set the --sp-* variables yourself); see shibuya_page.LOOKS
look = "rtd"
# "auto" loads the look's fonts; or a stylesheet URL that loads your own; or "" for none
webfonts = "auto"
# the left sidebar leaves out a page's own headings (the right sidebar lists those)
prune_page_headings = "true"
# links that leave the site open in a new tab
external_links_new_tab = "true"
# notebook pages get a Download link for their source, at the end of the breadcrumbs
download_notebooks = "true"
# notebook pages get a Run link, before Download, to this page on running them: a docname (with an
# optional #anchor) or a URL; "" for none
run_notebooks = ""
# pages with code get a Fold code button above the right sidebar's table of contents
fold_code = "true"
# matplotlib's figures in notebooks run by the build: "svg", "retina" (2x PNG), a list such as
# "svg,pdf", or "" to leave them alone (PNG)
notebook_figures = "svg"
