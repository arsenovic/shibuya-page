# Test the looks, then build reasonable-docs-template once per look into one demo site with a look
# switcher, and publish it on GitHub Pages. The demo is built against the locked Shibuya and the
# newest one, weekly too, to catch a Shibuya release that changes a template this theme copies.
# Turn Pages on first: Settings > Pages > Source: GitHub Actions.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest

  demo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shibuya: [locked, newest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: shibuya-page
      # The template finds shibuya-page beside it.
      - uses: actions/checkout@v4
        with:
          repository: arsenovic/reasonable-docs-template
          path: reasonable-docs-template
      - uses: astral-sh/setup-uv@v6
      - if: matrix.shibuya == 'newest'
        run: uv lock --upgrade-package shibuya
        working-directory: reasonable-docs-template
      - run: uv run --group docs python -m shibuya_page.looks docs ../site -W
        working-directory: reasonable-docs-template
      - if: matrix.shibuya == 'locked'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, demo]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
